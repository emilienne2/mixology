# Chez Émilienne web app

services:
  frontend:
    image: nginx:alpine
    ports:
      # Host 8080 → container HTTP port so the site is reachable at localhost:8080
      - "8080:80"
    volumes:
      # Bind-mount onto nginx's default document root so HTML/JS edits appear without a rebuild
      - ./frontend/public:/usr/share/nginx/html
      # Serves /recipes/<path> from the single recipe page
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/mixology.db
      # Google AI Studio key for the free Gemini tier. Compose reads a gitignored .env file.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./database/mixology.db:/data/mixology.db:ro
