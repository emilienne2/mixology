# Chez Émilienne web app

services:
  frontend:
    image: nginx:alpine
    ports:
      # Host 8080 → container HTTP port so the site is reachable at localhost:8080
      - "8080:80"
    volumes:
      # Bind-mount onto nginx's default document root so HTML/JS edits appear without a rebuild
      - ./frontend/public:/usr/share/nginx/html
      # Serves /recipes/<slug> from the single recipe page
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
